name: FNV / Windows local NIF extractor

on:
  workflow_dispatch:
  push:
    branches:
      - 'fnv/native-nif-preview'
      - 'fnv/phase8-dds-textures'
      - 'fnv/phase9-automatic-material-pair'
      - 'fnv/phase11-distinct-asset-discovery'
      - 'fnv/playable-goodsprings-interior'

permissions:
  contents: read

jobs:
  extractor:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust pinned toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Test extractor selection without Bethesda assets
        shell: pwsh
        run: cargo test -p falloutnv-ios-nif-extractor --locked
      - name: Compile extractor for Windows
        shell: pwsh
        run: cargo build -p falloutnv-ios-nif-extractor --release --locked
      - name: Place Goodsprings one-click builder beside the executable
        shell: pwsh
        run: Copy-Item ios/nif-extractor/Build-Goodsprings.cmd target/release/Build-Goodsprings.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: FalloutNV-local-NIF-extractor-Windows
          path: |
            target/release/falloutnv-ios-nif-extractor.exe
            target/release/Build-Goodsprings.cmd
          if-no-files-found: error
